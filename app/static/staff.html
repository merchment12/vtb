<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разбор блокировок · сотрудник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common.css">
<style>
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 24px;align-items:start}
aside{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:76px}
aside h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:4px 6px 10px}
.qitem{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;padding:10px 12px;margin-bottom:6px;background:#fff;font-weight:400}
.qitem:hover{background:var(--soft)}
.qitem.active{border-color:var(--blue);background:var(--soft)}
.qitem b{display:block;font-size:14px}
.qitem span{font-size:12px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.head h2{margin:0;font-size:22px;font-weight:800}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.verdict{border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center}
.verdict .tag{font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;background:#fff;white-space:nowrap}
.verdict.low_risk{background:var(--ok-bg)} .verdict.low_risk .tag{color:var(--ok)}
.verdict.needs_attention{background:var(--warn-bg)} .verdict.needs_attention .tag{color:var(--warn)}
.verdict.high_risk{background:var(--high-bg)} .verdict.high_risk .tag{color:var(--high)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--soft);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.arrow{color:var(--blue);font-weight:800;text-align:center}
.scroll{max-height:420px;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.docs a{color:var(--blue);font-weight:700;text-decoration:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header>
  <div><h1>Разбор блокировок самозанятых</h1><small>Рабочее место сотрудника · синтетические данные</small></div>
  <div class="actions">
    <button class="ghost" id="seedBtn">Загрузить демо-кейсы</button>
    <a href="/client" target="_blank">Экран клиента ↗</a>
    <a href="/docs">API</a>
  </div>
</header>
<div class="layout">
  <aside><h2>Очередь</h2><div id="queue"><div class="empty">Загрузка…</div></div></aside>
  <main id="main"><div class="card empty">Выберите кейс в очереди или нажмите «Загрузить демо-кейсы».</div></main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/common.js"></script>
<script>
const DOC = {receipts:"Чеки «Мой налог»", npd_certificate:"Справка о постановке на учёт НПД", income_certificate:"Справка о доходах НПД",
  contract:"Договор", act:"Акт", explanation:"Письменное пояснение", other:"Файл из переписки"};
const VERDICT = {low_risk:"Низкий риск", needs_attention:"Нужно внимание", high_risk:"Высокий риск"};
const LEVEL = {ok:"Норма", info:"Инфо", warn:"Внимание", high:"Высокий"};
const KIND = {one_to_one:"1 : 1", many_tx:"несколько платежей → чек", many_receipts:"платёж → несколько чеков"};
const NPD = {active:"активен", inactive:"не плательщик НПД", unknown:"не проверен"};
const PCT_CODES = new Set(["receipt_coverage","transit","cash_out","night_share","cancelled_receipts","personal_relabel"]);
let current = null, currentStatus = null;

function fmtValue(i, v){
  if (v == null) return "—";
  if (PCT_CODES.has(i.code)) return Math.round(v * 100) + "%";
  if (i.code === "npd_limit") return rub(v);
  if (i.code === "npd_status") return NPD[v] || esc(v);
  return esc(v);
}
async function loadQueue(){
  const cases = await api("/api/staff/cases");
  const q = document.getElementById("queue");
  if (!cases.length){ q.innerHTML = '<div class="empty">Очередь пуста</div>'; return cases; }
  q.innerHTML = cases.map(c => `<button class="qitem ${c.id === current ? "active" : ""}" data-id="${c.id}">
      <b>${esc(c.full_name)}</b><span>#${c.id} · ${esc(STATUS[c.status] || c.status)} · ${esc(REASON[c.block_reason] || c.block_reason)}</span></button>`).join("");
  q.querySelectorAll(".qitem").forEach(b => b.onclick = () => openCase(Number(b.dataset.id)));
  return cases;
}

async function openCase(id){
  current = id;
  history.replaceState(null, "", `#case=${id}`);
  const r = await api(`/api/staff/cases/${id}/report`);
  currentStatus = r.status;
  await loadQueue();
  render(r);
  await refreshChat();
}

function render(r){
  const m = r.matching;
  const reviewable = ["submitted", "in_review"].includes(r.status);
  const indicators = [...r.indicators].sort((a, b) => ["high","warn","info","ok"].indexOf(a.level) - ["high","warn","info","ok"].indexOf(b.level));
  const pairs = m.pairs.map(p => {
    const pay = p.payments.map(x => `${dt(x.operated_at)} · ${esc(x.counterparty || "—")} · <b>${rub(x.amount)}</b>`).join("<br>");
    const rc = p.receipts.map(x => `${dt(x.operation_time)} · ${esc(x.service || "—")} · <b>${rub(x.amount)}</b>`).join("<br>");
    return `<tr><td>${pay}</td><td class="arrow">↔</td><td>${rc}</td><td><span class="chip info">${KIND[p.kind] || p.kind}</span>${p.late ? ' <span class="chip warn">чек позже оплаты</span>' : ""}</td></tr>`;
  }).join("");
  const unmatched = m.unmatched_income.map(x => `<tr><td>${dt(x.operated_at)}</td><td>${esc(x.counterparty || "—")}</td><td class="num">${rub(x.amount)}</td><td>${x.client_comment ? esc(x.client_comment) : '<span class="muted">нет пояснения</span>'}</td></tr>`).join("");
  const personal = m.personal_income.map(x => `<tr><td>${dt(x.operated_at)}</td><td>${esc(x.counterparty || "—")}</td><td class="num">${rub(x.amount)}</td><td>${esc(x.client_comment || "—")}</td><td>${x.relabeled ? '<span class="chip warn">система: доход</span>' : ""}</td></tr>`).join("");
  const noPay = m.receipts_without_payment.length;

  document.getElementById("main").innerHTML = `
  <div class="card head">
    <div><h2>${esc(r.full_name)}</h2>
      <div class="meta">ИНН ${esc(r.inn)} · ${esc(REASON[r.block_reason] || r.block_reason)} · блокировка ${d(r.blocked_at)} · операции ${d(r.period.start)} — ${d(r.period.end)}</div>
      <div class="meta">Статус: <b>${esc(STATUS[r.status] || r.status)}</b> · повторных запросов: ${r.request_rounds}</div></div>
  </div>
  <div class="verdict ${esc(r.verdict)}"><span class="tag">${esc(VERDICT[r.verdict] || r.verdict)}</span><div>${esc(r.verdict_text)}<div class="note" style="margin:2px 0 0">Это подсказка системы. Решение принимает сотрудник.</div></div></div>
  <div class="kpis">
    <div class="kpi"><b>${rub(r.totals.credits)}</b><span>все поступления</span></div>
    <div class="kpi"><b>${rub(r.totals.receipts)}</b><span>действующие чеки</span></div>
    <div class="kpi"><b>${m.matched}</b><span>найдено пар «платёж ↔ чек»</span></div>
    <div class="kpi"><b>${m.unmatched_income.length}</b><span>поступлений от деятельности без чека</span></div>
    <div class="kpi"><b>${(r.build_ms / 1000).toLocaleString("ru-RU", {maximumFractionDigits: 2})} с</b><span>заняла автоматическая сверка</span></div>
  </div>
  <div class="card"><h3>Индикаторы</h3>
    <table><tr><th>Уровень</th><th>Показатель</th><th class="num">Значение</th><th>Пояснение</th></tr>
    ${indicators.map(i => `<tr><td><span class="chip ${esc(i.level)}">${LEVEL[i.level] || esc(i.level)}</span></td><td><b>${esc(i.title)}</b></td><td class="num">${fmtValue(i, i.value)}</td><td class="muted">${esc(i.explanation)}</td></tr>`).join("")}
    </table></div>
  <div class="card"><h3>Сверка: платежи и чеки (${m.matched} пар${noPay ? `, ${noPay} чеков без платежа` : ""})</h3>
    <div class="scroll"><table><tr><th>Поступление на карту</th><th></th><th>Чек «Мой налог»</th><th>Тип связи</th></tr>${pairs || '<tr><td colspan="4" class="muted">Пар не найдено</td></tr>'}</table></div></div>
  <div class="two">
    <div class="card"><h3>Без чека — пояснения клиента (${m.unmatched_income.length})</h3>
      <div class="scroll"><table><tr><th>Дата</th><th>Отправитель</th><th class="num">Сумма</th><th>Пояснение</th></tr>${unmatched || '<tr><td colspan="4" class="muted">Все поступления подтверждены чеками</td></tr>'}</table></div></div>
    <div class="card"><h3>Отнесено клиентом к личным (${m.personal_income.length})</h3>
      <div class="scroll"><table><tr><th>Дата</th><th>Отправитель</th><th class="num">Сумма</th><th>Комментарий</th><th></th></tr>${personal || '<tr><td colspan="5" class="muted">Нет</td></tr>'}</table></div></div>
  </div>
  <div class="two">
    <div class="card docs"><h3>Документы клиента (${r.documents.length})</h3>
      ${r.documents.length ? `<table><tr><th>Документ</th><th>Файл</th><th>Загружен</th></tr>${r.documents.map(x =>
        `<tr><td>${esc(DOC[x.doc_type] || x.doc_type)}</td><td><a href="/api/staff/cases/${r.case_id}/documents/${x.id}">${esc(x.filename)}</a></td><td>${dt(x.uploaded_at)}</td></tr>`).join("")}</table>`
        : '<div class="muted">Клиент ещё ничего не загрузил</div>'}
      <div class="note">Операции по карте взяты из системы банка, а не от клиента.</div></div>
    <div class="card"><h3>Переписка с клиентом</h3>
      <div class="chat" id="chat"></div>
      <div class="composer"><textarea id="msg" placeholder="Написать клиенту"></textarea>
        <button class="primary" onclick="sendMessage()">Отправить</button></div></div>
  </div>
  <div class="card"><h3>Решение</h3>
    <label class="muted">Точечный запрос клиенту (черновик системы, можно править — по строке на пункт)</label>
    <textarea id="reqText">${esc((r.request_draft || []).join("\n"))}</textarea>
    <div style="height:10px"></div>
    <input type="text" id="comment" placeholder="Комментарий к решению">
    <div style="height:12px"></div>
    <div class="actions">
      <button class="primary" ${reviewable ? "" : "disabled"} onclick="decide('unblock')">Разблокировать</button>
      <button ${reviewable ? "" : "disabled"} onclick="requestDocs()">Запросить документы</button>
      <button class="danger" ${reviewable ? "" : "disabled"} onclick="decide('reject')">Отказать</button>
      ${reviewable ? "" : `<span class="muted">Кейс в статусе «${esc(STATUS[r.status] || r.status)}» — действия недоступны</span>`}
    </div>
    <div class="note">Решение и индикаторы, на которых оно принято, сохраняются в журнал кейса.</div>
  </div>`;
}

async function decide(decision){
  const comment = document.getElementById("comment").value.trim();
  if (comment.length < 3){ toast("Укажите обоснование решения — оно сохраняется в журнал"); document.getElementById("comment").focus(); return; }
  try{
    await api(`/api/staff/cases/${current}/decision`, {method:"POST", body: JSON.stringify({decision, comment})});
    toast(decision === "unblock" ? "Кейс разблокирован" : "Отказ сохранён");
    openCase(current);
  }catch(e){ toast("Ошибка: " + e.message); }
}
async function requestDocs(){
  const items = document.getElementById("reqText").value.split("\n").map(s => s.trim()).filter(Boolean);
  try{
    await api(`/api/staff/cases/${current}/request-docs`, {method:"POST", body: JSON.stringify({items, comment: document.getElementById("comment").value || null})});
    toast("Запрос отправлен клиенту");
    openCase(current);
  }catch(e){ toast("Ошибка: " + e.message); }
}
async function refreshChat(){
  const el = document.getElementById("chat");
  if (el && current) renderChat(el, await api(`/api/staff/cases/${current}/messages`), "staff");
}
async function sendMessage(){
  const ta = document.getElementById("msg");
  const text = ta.value.trim();
  if (!text) return;
  try{ renderChat(document.getElementById("chat"), await api(`/api/staff/cases/${current}/messages`, {method:"POST", body: JSON.stringify({text})}), "staff"); ta.value = ""; }
  catch(e){ toast("Ошибка: " + e.message); }
}
// подхватываем действия клиента: новые кейсы в очереди, сообщения, повторную отправку пакета
setInterval(async () => {
  try{
    const cases = await loadQueue();
    if (!current) return;
    const c = cases.find(x => x.id === current);
    if (c && c.status !== currentStatus && !isTyping()) await openCase(current);
    else await refreshChat();
  }catch(_){ /* сервер перезапускается — попробуем в следующий раз */ }
}, 5000);
document.getElementById("seedBtn").onclick = async () => {
  const b = document.getElementById("seedBtn"); b.disabled = true;
  try{ const r = await api("/api/demo/seed", {method:"POST"}); toast(`Добавлено кейсов: ${r.case_ids.length}`); await loadQueue(); openCase(r.case_ids[0]); }
  catch(e){ toast("Ошибка: " + e.message); }
  finally{ b.disabled = false; }
};
loadQueue().then(() => {
  const id = Number((location.hash.match(/case=(\d+)/) || [])[1]);  // ссылка вида /staff#case=5
  if (id) openCase(id);
}).catch(e => document.getElementById("queue").innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`);
</script>
</body>
</html>
